<title>ALI KEYBOARD — ULTRA</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #030712;
  --surface: #0d1117;
  --key: #111827;
  --key-border: #1f2937;
  --accent: #00f5ff;
  --accent2: #ff00ff;
  --text: #e2e8f0;
  --glow: 0 0 12px #00f5ff66, 0 0 30px #00f5ff22;
  --glow2: 0 0 12px #ff00ff66, 0 0 30px #ff00ff22;
  --font-mono: 'Share Tech Mono', monospace;
  --font-display: 'Orbitron', sans-serif;
}

* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }

html, body {
  width: 100%; min-height: 100vh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-mono);
  overflow-x: hidden;
  background-image:
    radial-gradient(ellipse at 20% 0%, #00f5ff0a 0%, transparent 60%),
    radial-gradient(ellipse at 80% 100%, #ff00ff08 0%, transparent 60%);
  transition: background-color 0.5s;
}

body::before {
  content:''; position:fixed; inset:0;
  background: repeating-linear-gradient(0deg, transparent, transparent 2px, #00000018 2px, #00000018 4px);
  pointer-events:none; z-index:9999;
}
body::after {
  content:''; position:fixed; inset:0;
  background-image: linear-gradient(#00f5ff08 1px, transparent 1px), linear-gradient(90deg, #00f5ff08 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events:none; z-index:0;
}

/* ── PANEL OVERLAY ── */
.panel-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0);
  z-index: 4000;
  pointer-events: none;
  transition: background 0.3s ease;
}
.panel-overlay.open { background: rgba(0,0,0,0.6); pointer-events: all; }

/* ── SLIDE PANEL ── */
.options-panel {
  position: fixed;
  top: 0; right: -110%;
  width: min(300px, 86vw);
  height: 100%;
  background: var(--surface);
  border-left: 1px solid var(--key-border);
  z-index: 4001;
  display: flex; flex-direction: column;
  transition: right 0.35s cubic-bezier(0.4,0,0.2,1);
  overflow-y: auto; scrollbar-width: none;
  box-shadow: -8px 0 40px #00000066;
}
.options-panel::-webkit-scrollbar { display: none; }
.options-panel.open { right: 0; }

.panel-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 14px 10px;
  border-bottom: 1px solid var(--key-border);
  position: sticky; top: 0;
  background: var(--surface); z-index: 1;
}
.panel-title { font-family: var(--font-display); font-size: 12px; color: var(--accent); letter-spacing: 3px; }
.panel-close {
  width: 30px; height: 30px;
  border: 1px solid var(--key-border); border-radius: 8px;
  background: var(--key); color: var(--text); font-size: 16px;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
.panel-close:active { border-color: var(--accent2); color: var(--accent2); }

.panel-section { padding: 10px 12px; border-bottom: 1px solid #ffffff08; }
.panel-section-title { font-size: 9px; letter-spacing: 3px; color: var(--accent); opacity: 0.55; margin-bottom: 8px; font-family: var(--font-display); }

.panel-theme-select {
  width: 100%; padding: 10px 12px;
  border: 1px solid var(--key-border); border-radius: 10px;
  background: var(--key); color: var(--text);
  font-family: var(--font-mono); font-size: 14px; cursor: pointer; letter-spacing: 1px;
  -webkit-appearance: none; appearance: none;
}
.panel-theme-select:focus { outline: none; border-color: var(--accent); }

.panel-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 7px; }

.panel-btn {
  padding: 11px 8px;
  border: 1px solid var(--key-border); border-radius: 10px;
  background: var(--key); color: var(--text);
  font-family: var(--font-mono); font-size: 13px;
  cursor: pointer; letter-spacing: 1px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: border-color 0.15s, color 0.15s, box-shadow 0.15s, transform 0.08s;
  white-space: nowrap;
}
.panel-btn:active { border-color: var(--accent); color: var(--accent); box-shadow: var(--glow); transform: scale(0.95); }
.panel-btn.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: var(--glow); font-weight: bold; }
.panel-btn.active2 { background: var(--accent2); color: #000; border-color: var(--accent2); box-shadow: var(--glow2); font-weight: bold; }
.panel-btn.send-btn {
  grid-column: 1/-1;
  background: linear-gradient(135deg,#00f5ff,#0080ff);
  color: #000; font-weight: bold; border-color: #00f5ff;
  font-size: 15px; padding: 13px;
}
.panel-btn.send-btn:active { transform: scale(0.97); }
.panel-bg-label {
  padding: 11px 8px;
  border: 1px solid var(--key-border); border-radius: 10px;
  background: var(--key); color: var(--text);
  font-family: var(--font-mono); font-size: 13px;
  cursor: pointer; letter-spacing: 1px; text-align: center;
  display: flex; align-items: center; justify-content: center; gap: 5px;
  transition: border-color 0.15s, color 0.15s;
}
.panel-bg-label:active { border-color: var(--accent); color: var(--accent); }

/* ── MENU BTN ── */
.menu-btn {
  width: 34px; height: 34px;
  border: 1px solid var(--key-border); border-radius: 9px;
  background: var(--key); color: var(--accent);
  font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; flex-shrink: 0;
}
.menu-btn:active { border-color: var(--accent); box-shadow: var(--glow); transform: scale(0.93); }

/* ── WRAPPER ── */
.wrapper {
  position: relative; z-index: 1;
  max-width: 900px; margin: 0 auto;
  padding: 6px;
  display: flex; flex-direction: column; gap: 5px;
  min-height: 100vh;
}

/* ── HEADER ── */
.header { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; }
.logo { font-family: var(--font-display); font-size: clamp(14px,4vw,22px); font-weight: 900; color: var(--accent); text-shadow: var(--glow); letter-spacing: 4px; }
.logo span { color: var(--accent2); text-shadow: var(--glow2); }
.header-right { display: flex; align-items: center; gap: 8px; }
.status { font-size: 10px; color: #00f5ff88; letter-spacing: 2px; animation: blink 2s infinite; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:.3} }

/* ── OUTPUT ── */
.output-wrapper {
  position: relative;
  background: var(--surface);
  border: 1px solid var(--key-border);
  border-radius: 16px; overflow: hidden;
  transition: background 0.5s, border-color 0.5s;
}
.output-wrapper::before {
  content:''; position:absolute; top:0; left:0; right:0; height:2px;
  background: linear-gradient(90deg, var(--accent), var(--accent2), var(--accent));
  background-size: 200% 100%;
  animation: scanline 3s linear infinite;
}
@keyframes scanline { 0%{background-position:0%} 100%{background-position:200%} }
.output-label { font-family: var(--font-display); font-size: 9px; letter-spacing: 3px; color: var(--accent); padding: 5px 10px 0; opacity:.7; }

textarea {
  width: 100%; min-height: 65px; max-height: 120px;
  border: none; outline: none; background: transparent;
  color: var(--text); font-family: var(--font-mono);
  font-size: 19px; resize: none;
  padding: 8px 12px 10px; line-height: 1.6;
  caret-color: var(--accent);
}
.output-footer {
  display: flex; justify-content: space-between; align-items: center;
  padding: 2px 10px 5px; font-size: 9px; color: #ffffff33; letter-spacing: 1px;
}

/* ── SUGGESTIONS ── */
.suggestions {
  display: flex; gap: 6px; overflow-x: auto;
  padding: 2px 0; scrollbar-width: none; min-height: 34px;
  flex-shrink: 0;
}
.suggestions::-webkit-scrollbar { display:none; }
.sug-item {
  padding: 6px 12px;
  background: var(--surface); border: 1px solid var(--accent);
  border-radius: 20px; font-family: var(--font-mono);
  font-size: 13px; color: var(--accent); white-space: nowrap;
  cursor: pointer; transition: all .1s; letter-spacing: 1px;
  animation: fadeIn .15s ease; flex-shrink: 0;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(3px)} to{opacity:1;transform:none} }
.sug-item:active { background: var(--accent); color: #000; box-shadow: var(--glow); }

/* ── KEYBOARD ── */
.keyboard-container {
  background: var(--surface); border: 1px solid var(--key-border);
  border-radius: 16px; padding: 6px;
  position: relative; overflow: hidden;
  transition: background 0.5s, border-color 0.5s;
}
.keyboard-container::after {
  content:''; position:absolute; bottom:0; left:0; right:0; height:1px;
  background: linear-gradient(90deg, transparent, var(--accent2), transparent);
}
.keyboard { display: flex; flex-direction: column; gap: 4px; }
.row { display: flex; gap: 3px; justify-content: center; }

/* Accents row */
.accents-row {
  display: flex; gap: 3px; overflow-x: auto;
  scrollbar-width: none; padding-bottom: 3px; flex-shrink: 0;
}
.accents-row::-webkit-scrollbar { display: none; }

/* Keys */
.key {
  flex: 1; min-width: 26px; max-width: 60px;
  height: 40px;
  border: 1px solid var(--key-border); border-radius: 9px;
  background: var(--key); color: var(--text);
  font-family: var(--font-mono); font-size: 22px;
  cursor: pointer; position: relative; overflow: hidden;
  transition: border-color 0.08s, box-shadow 0.08s, transform 0.07s, background 0.5s;
  user-select: none; will-change: transform;
}
.key::after {
  content:''; position:absolute; inset:0;
  background: linear-gradient(180deg,#ffffff0a 0%,transparent 100%);
  border-radius: inherit; pointer-events:none;
}
.key:active, .key.pressed {
  transform: scale(.92) translateY(1px);
  background: #1e293b;
  border-color: var(--accent);
  box-shadow: var(--glow);
}

/* Ripple */
.ripple {
  position: absolute; border-radius: 50%;
  background: var(--accent); opacity: .28;
  transform: scale(0);
  animation: ripple-anim 0.45s ease-out forwards;
  pointer-events: none;
}
@keyframes ripple-anim { to { transform: scale(4); opacity: 0; } }

/* Special keys */
.key-special {
  background: linear-gradient(135deg,#1a2744,#0f172a);
  border-color: var(--accent); color: var(--accent);
  font-family: var(--font-display); font-size: 11px; font-weight: 700;
  letter-spacing: 1px; max-width: none;
}
.key-special:active { box-shadow: var(--glow); }

.key-delete {
  background: linear-gradient(135deg,#3d0a0a,#1a0a0a);
  border-color: #ff444455; color: #ff6666;
}
.key-delete:active { border-color: #ff4444; box-shadow: 0 0 12px #ff444466; }

.key-space { flex: 4; max-width: none; font-size: 10px; letter-spacing: 3px; color: #ffffff33; }
.key-enter { background: linear-gradient(135deg,#003d3d,#001a1a); border-color: var(--accent); color: var(--accent); max-width: none; }

.key-accent {
  background: linear-gradient(135deg,#1a1040,#0f0820);
  border-color: var(--accent2); color: var(--accent2);
  font-size: 17px; min-width: 34px; max-width: 42px; flex: 0 0 auto;
}
.key-accent:active { box-shadow: var(--glow2); border-color: var(--accent2); }

.key-shift.active, .key-num.active { background: var(--accent); color: #000; border-color: var(--accent); box-shadow: var(--glow); }
.key-emoji.active { background: var(--accent2); color: #000; border-color: var(--accent2); box-shadow: var(--glow2); }

/* ── ARROWS ── */
.arrow-section { display: flex; justify-content: center; margin-top: 3px; }
.arrow-grid { display: grid; grid-template-columns: repeat(3,38px); grid-template-rows: repeat(2,34px); gap: 4px; }
.arrow-grid .key { min-width: unset; width: 38px; height: 34px; font-size: 13px; max-width: none; flex: none; }
.arrow-grid .key-blank { background: transparent; border-color: transparent; pointer-events: none; }

/* ── MODE BAR ── */
.mode-bar { display: flex; gap: 6px; align-items: center; justify-content: center; padding: 2px 0 1px; }
.mode-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--key-border); transition: background .25s, box-shadow .25s; }
.mode-dot.active { background: var(--accent); box-shadow: var(--glow); }
.mode-dot.active2 { background: var(--accent2); box-shadow: var(--glow2); }
.mode-label { font-size: 10px; color: #ffffff33; letter-spacing: 2px; font-family: var(--font-display); }

/* ── TOAST ── */
#toast {
  position: fixed; bottom: 20px; left: 50%;
  transform: translateX(-50%) translateY(80px);
  background: var(--surface); border: 1px solid var(--accent);
  color: var(--accent); padding: 10px 22px; border-radius: 30px;
  font-family: var(--font-mono); font-size: 13px; letter-spacing: 2px;
  box-shadow: var(--glow); transition: transform .3s cubic-bezier(.34,1.56,.64,1);
  z-index: 10000; white-space: nowrap;
}
#toast.show { transform: translateX(-50%) translateY(0); }

/* ── BG ── */
body.has-bg { background-attachment: fixed; background-size: cover; background-position: center; }
body.has-bg .keyboard-container, body.has-bg .output-wrapper { background: rgba(0,0,0,.65); backdrop-filter: blur(18px); }
body.has-bg .options-panel { background: rgba(13,17,23,0.93); backdrop-filter: blur(20px); }

/* ── RESPONSIVE ── */
@media (max-width: 380px) { .key { height: 36px; font-size: 16px; } .row { gap: 2px; } }
@media (min-width: 600px) { .key { height: 44px; font-size: 19px; } .row { gap: 5px; } }
  /* ===== ULTRA SMOOTH PATCH ===== */

transform .18s cubic-bezier(.22,1,.36,1),

// ── AUDIO ──
let audioCtx = null;
function getAudioCtx() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }
function playClick(type) {
  if (!soundEnabled) return;
  try {
    const ctx = getAudioCtx(); if (ctx.state === 'suspended') ctx.resume();
    const osc = ctx.createOscillator(), gain = ctx.createGain();
    osc.connect(gain); gain.connect(ctx.destination);
    if (type === 'delete') { osc.frequency.value = 200; gain.gain.value = 0.05; }
    else if (type === 'special') { osc.frequency.value = 800; gain.gain.value = 0.05; }
    else { osc.frequency.value = 600 + Math.random()*120; gain.gain.value = 0.04; }
    osc.type = 'sine'; osc.start();
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.06);
    osc.stop(ctx.currentTime + 0.06);
  } catch(e) {}
}

// ── VIBRATION ──
function vibrate(ms) { try { if (navigator.vibrate) navigator.vibrate(ms||15); } catch(e) {} }

// ── RIPPLE ──
function addRipple(btn, e) {
  const rect = btn.getBoundingClientRect();
  const x = (e.touches ? e.touches[0].clientX : e.clientX) - rect.left;
  const y = (e.touches ? e.touches[0].clientY : e.clientY) - rect.top;
  const rp = document.createElement('span');
  rp.className = 'ripple';
  rp.style.cssText = `width:${rect.width}px;height:${rect.width}px;left:${x-rect.width/2}px;top:${y-rect.width/2}px`;
  btn.appendChild(rp);
  setTimeout(() => rp.remove(), 450);
}

// ── INSERT TEXT ──
function insertText(text) {
  if (window.AndroidKeyboard) AndroidKeyboard.sendText(text);
  const s = output.selectionStart, e2 = output.selectionEnd;
  output.value = output.value.substring(0,s) + text + output.value.substring(e2);
  const pos = s + text.length;
  output.selectionStart = output.selectionEnd = pos;
  if (text === ' ') autoCorrectLastWord();
  output.focus();
  saveWord(text); showSuggestions(); updateStats();
}

// ── BACKSPACE ──
function doBackspace() {
  if (window.AndroidKeyboard) AndroidKeyboard.sendBackspace();
  const s = output.selectionStart, e2 = output.selectionEnd;
  if (s !== e2) { output.value = output.value.substring(0,s)+output.value.substring(e2); output.selectionStart=output.selectionEnd=s; }
  else if (s > 0) { output.value = output.value.substring(0,s-1)+output.value.substring(s); output.selectionStart=output.selectionEnd=s-1; }
  output.focus(); showSuggestions(); updateStats();
}

function saveWord(text) {
  if (text === ' ' || text === '\n') {
    const val = output.value.slice(0, output.value.length - 1);
    const words = val.trim().split(/\s+/);
    const completed = words[words.length - 1];
    if (completed && completed.length > 2) {
      const wLow = completed.toLowerCase();
      if (!learnedWords.includes(wLow)) {
        learnedWords.push(wLow);
        try { localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); } catch(e) {}
      }
      if (completed !== wLow && !learnedWords.includes(completed)) {
        learnedWords.push(completed);
        try { localStorage.setItem('learnedWords', JSON.stringify(learnedWords)); } catch(e) {}
      }
      savedWords = savedWords.filter(s => s.toLowerCase() !== wLow);
      savedWords.unshift(completed);
      try { localStorage.setItem('ali_words', JSON.stringify(savedWords.slice(0,300))); } catch(e) {}
    }
  }
}

function showSuggestions() {
  suggestions.innerHTML = '';
  const words = output.value.split(/\s/);
  const current = words[words.length-1].toLowerCase().normalize('NFC');
  if (current.length < 1) return;

  // Remove accents for fuzzy match
  const norm = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  const normCurrent = norm(current);

  const pool = [...new Set([...learnedWords, ...savedWords, ...dictionary])];

  // Priority 1: starts with exact current
  const p1 = pool.filter(w => w.toLowerCase().startsWith(current) && w.toLowerCase() !== current);
  // Priority 2: normalized starts with (accent-insensitive)
  const p2 = pool.filter(w => !p1.includes(w) && norm(w).startsWith(normCurrent) && norm(w) !== normCurrent);
  // Priority 3: contains current
  const p3 = pool.filter(w => !p1.includes(w) && !p2.includes(w) && norm(w).includes(normCurrent) && norm(w) !== normCurrent);

  const matches = [...p1, ...p2, ...p3].slice(0, 12);
  matches.forEach(word => {
    const div = document.createElement('div');
    div.className = 'sug-item';
    div.textContent = caps ? word.toUpperCase() : word;
    div.addEventListener('click', () => {
      const ws = output.value.split(/\s/);
      const partial = ws[ws.length-1];
      ws[ws.length-1] = word;
      output.value = ws.join(' ') + ' ';
      output.selectionStart = output.selectionEnd = output.value.length;
      if (window.AndroidKeyboard) {
        for (let i=0; i<partial.length; i++) AndroidKeyboard.sendBackspace();
        AndroidKeyboard.sendText(word + ' ');
      }
      suggestions.innerHTML = '';
      updateStats(); vibrate(15);
    });
    suggestions.appendChild(div);
  });
}

// ── CURSOR ──
function moveCursor(dir) {
  let pos = output.selectionStart;
  const v = output.value;
  if (dir==='left') pos=Math.max(0,pos-1);
  else if (dir==='right') pos=Math.min(v.length,pos+1);
  else if (dir==='up') {
    const ls=v.lastIndexOf('\n',pos-1), pls=v.lastIndexOf('\n',ls-1), col=pos-ls-1;
    pos=Math.min(pls+1+col,ls===-1?pos:ls);
  }
  else if (dir==='down') {
    const le=v.indexOf('\n',pos);
    if (le===-1) pos=v.length;
    else { const nle=v.indexOf('\n',le+1), ls=v.lastIndexOf('\n',pos-1), col=pos-ls-1; pos=Math.min(le+1+col,nle===-1?v.length:nle); }
  }
  output.selectionStart=output.selectionEnd=pos; output.focus(); vibrate(10);
}

let lastRgbTime = 0;
function scheduleRGB() {
  if (rgbRaf) cancelAnimationFrame(rgbRaf);
  let keys = [];
  function frame(ts) {
    if (!rgb) return;
    if (ts - lastRgbTime > 250) {
      lastRgbTime = ts;
      rgbHue = (rgbHue + 2) % 360;
      if (!keys.length) keys = Array.from(document.querySelectorAll('.key'));
      keys.forEach((k,i) => {
        const h = (rgbHue + i*10) % 360;
        k.style.borderColor = `hsl(${h},100%,55%)`;
        k.style.boxShadow = 'none';
      });
    }
    rgbRaf = requestAnimationFrame(frame);
  }
  rgbRaf = requestAnimationFrame(frame);
}

// ── PRESSE-PAPIER ──
let clipboardHistory = [];
try { clipboardHistory = JSON.parse(localStorage.getItem('ali_clipboard') || '[]'); } catch(e) {}

function toggleClipboard() {
  const sec = document.getElementById('clipboardSection');
  const isOpen = sec.style.display !== 'none';
  sec.style.display = isOpen ? 'none' : 'block';
  if (!isOpen) renderClipboard();
}

function addToClipboard(text) {
  if (!text || text.trim().length < 2) return;
  clipboardHistory = clipboardHistory.filter(t => t !== text);
  clipboardHistory.unshift(text);
  clipboardHistory = clipboardHistory.slice(0, 20);
  try { localStorage.setItem('ali_clipboard', JSON.stringify(clipboardHistory)); } catch(e) {}
}

function renderClipboard() {
  const list = document.getElementById('clipboardList');
  list.innerHTML = '';
  if (clipboardHistory.length === 0) {
    list.innerHTML = '<div style="font-size:11px;color:#ffffff44;text-align:center;padding:10px">Aucun texte copié</div>';
    return;
  }
  clipboardHistory.forEach((text, i) => {
    const item = document.createElement('div');
    item.style.cssText = 'display:flex;gap:6px;align-items:center';
    const preview = document.createElement('div');
    preview.style.cssText = 'flex:1;font-size:12px;color:var(--text);background:var(--key);border:1px solid var(--key-border);border-radius:8px;padding:6px 10px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer';
    preview.textContent = text.length > 40 ? text.slice(0,40)+'…' : text;
    preview.onclick = () => { output.value += text; updateStats(); showSuggestions(); showToast('📌 COLLÉ'); closePanel(); };
    const del = document.createElement('button');
    del.className = 'panel-btn';
    del.style.cssText = 'padding:6px 10px;font-size:13px;flex-shrink:0';
    del.textContent = '✕';
    del.onclick = () => { clipboardHistory.splice(i,1); try{localStorage.setItem('ali_clipboard',JSON.stringify(clipboardHistory));}catch(e){} renderClipboard(); };
    item.appendChild(preview);
    item.appendChild(del);
    list.appendChild(item);
  });
}

function clearClipboard() {
  clipboardHistory = [];
  try { localStorage.removeItem('ali_clipboard'); } catch(e) {}
  renderClipboard();
  showToast('🗑 PRESSE-PAPIER VIDÉ');
}

const translations = {
  bonjour:'hello',bonsoir:'good evening',merci:'thanks',maison:'house',
  clavier:'keyboard',ordinateur:'computer',salut:'hi',oui:'yes',non:'no',
  amour:'love',beau:'beautiful',grand:'big',petit:'small',vite:'fast',

  soleil:'sun',lune:'moon',nuit:'night',jour:'day',ami:'friend',

  // EN→FR
  hello:'bonjour',thanks:'merci',house:'maison',car:'voiture',

  water:'eau',fire:'feu',sun:'soleil',moon:'lune',night:'nuit',

function translateWord() {
  const words = output.value.trim().split(/\s+/);
  const last = words[words.length-1].toLowerCase();
  const tr = translations[last];
  if (tr) { output.value+=` → ${tr}`; showToast(`${last} → ${tr}`); }
  else showToast('MOT INCONNU');
  updateStats();
}

function startVoice() {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR) return showToast('MICRO NON SUPPORTÉ');
  const btn = document.getElementById('btnVoice');
  if (btn._recognition) {
    try { btn._recognition.stop(); } catch(e) {}
    btn._recognition=null; btn.classList.remove('active'); btn.textContent='🎤 VOICE'; return;
  }
  const r = new SR(); btn._recognition=r;
  r.lang='fr-FR'; r.continuous=false; r.interimResults=false; r.maxAlternatives=1;
  btn.classList.add('active'); btn.textContent='🔴 ÉCOUTE...'; showToast('🎤 PARLEZ...'); vibrate(30);
  r.onresult=e=>{insertText(e.results[0][0].transcript+' '); showToast('🎤 OK');};
  r.onend=()=>{btn._recognition=null;btn.classList.remove('active');btn.textContent='🎤 VOICE';};
  r.onerror=ev=>{
    btn._recognition=null;btn.classList.remove('active');btn.textContent='🎤 VOICE';
    if(ev.error==='not-allowed')showToast('❌ MICRO REFUSÉ');
    else if(ev.error==='no-speech')showToast('⚠ AUCUNE VOIX');
    else showToast('ERREUR: '+ev.error);
  };
  try { r.start(); } catch(e) { btn._recognition=null;btn.classList.remove('active');btn.textContent='🎤 VOICE';showToast('ERREUR MICRO'); }
}

function autoCorrectLastWord() {
  const trimmed = output.value.trimEnd();
  const words = trimmed.split(/\s+/);
  if (!words.length) return;

  let last = words[words.length - 1].toLowerCase();
  if (corrections[last]) {
    words[words.length - 1] = corrections[last];
    output.value = words.join(' ') + ' ';
    output.selectionStart = output.selectionEnd = output.value.length;
  }
}

document.addEventListener('keydown', e=>{
  if (e.target===output) return;
  if (e.ctrlKey&&e.key==='c') copyText();
  if (e.ctrlKey&&e.key==='Delete') clearText();
});

output.addEventListener('input', () => {
  const words = output.value.split(/\s+/);
  if (words.length >= 2) {
    const prevWord = words[words.length - 2];
    if (prevWord && prevWord.length > 2) {
      learnWord(prevWord);
    }
  }

  autoCorrectLastWord();
  showSuggestions();
  updateStats();
});
output.addEventListener('keyup', showSuggestions);

}
